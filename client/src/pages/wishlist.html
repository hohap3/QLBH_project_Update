<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sản phẩm yêu thích - HP STORE</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      .wishlist-page-wrap {
        min-height: 62vh;
      }
      .wishlist-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .wishlist-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 14px 28px -10px rgba(15, 23, 42, 0.14);
        border-color: rgba(215, 0, 24, 0.25);
      }
      .wishlist-img-box {
        position: relative;
        height: 190px;
        padding: 16px;
        background: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wishlist-img-box img {
        max-height: 100%;
        max-width: 100%;
        object-fit: contain;
        transition: transform 0.25s ease;
      }
      .wishlist-card:hover .wishlist-img-box img {
        transform: scale(1.04);
      }
      .wishlist-remove-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1px solid #fecaca;
        background: #ffffff;
        color: #dc2626;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.15s ease;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .wishlist-remove-btn:hover {
        background: #dc2626;
        color: #ffffff;
      }
      .wishlist-title {
        font-size: 14px;
        font-weight: 700;
        color: #0f172a;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        min-height: 40px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body class="bg-light">
    <div id="header-shared"></div>

    <main class="container py-4 wishlist-page-wrap">
      <!-- Breadcrumb -->
      <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb small mb-0">
          <li class="breadcrumb-item">
            <a href="/index.html" class="text-decoration-none text-secondary">
              <i class="fa-solid fa-house me-1"></i>Trang chủ
            </a>
          </li>
          <li class="breadcrumb-item active fw-semibold text-danger" aria-current="page">
            Sản phẩm yêu thích
          </li>
        </ol>
      </nav>

      <!-- Header Card -->
      <div class="bg-white rounded-4 shadow-sm border p-3 p-md-4 mb-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
          <div>
            <h1 class="h4 fw-bold text-dark mb-1 d-flex align-items-center gap-2">
              <i class="fa-solid fa-heart text-danger"></i>
              <span>Sản phẩm yêu thích</span>
              <span id="wishlistPageCount" class="badge rounded-pill bg-danger fs-6">0</span>
            </h1>
            <p id="wishlistSyncStatus" class="text-muted small mb-0">
              Đang kiểm tra trạng thái đồng bộ...
            </p>
          </div>
          <div class="d-flex gap-2">
            <a href="/index.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3 fw-semibold">
              <i class="fa-solid fa-arrow-left me-1"></i>Tiếp tục mua sắm
            </a>
            <a href="/src/pages/cart.html" class="btn btn-danger btn-sm rounded-pill px-3 fw-semibold">
              <i class="fa-solid fa-cart-shopping me-1"></i>Xem giỏ hàng
            </a>
          </div>
        </div>
      </div>

      <!-- Grid sản phẩm yêu thích -->
      <div id="wishlist-grid" class="row g-3 g-md-4">
        <div class="col-12 text-center py-5 text-muted">
          <div class="spinner-border text-danger mb-2" role="status"></div>
          <div>Đang tải danh sách sản phẩm yêu thích...</div>
        </div>
      </div>
    </main>

    <div id="footer-shared"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/JS/common/header.js"></script>
    <script type="module" src="/src/JS/wishlist.js"></script>
  </body>
</html>
